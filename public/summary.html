<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RCLootCouncil Summary</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>RCLootCouncil Summary</h1>
    <p class="subtitle">
      Per-player totals · <a href="/">Loot log</a> · <a href="/docs.html">API docs</a>
    </p>
  </header>

  <main>
    <table id="summary-table">
      <thead>
        <tr>
          <th><button type="button" class="sort-btn" data-sort="player">Name</button></th>
          <th><button type="button" class="sort-btn" data-sort="class">Class</button></th>
          <th><button type="button" class="sort-btn" data-sort="spec">Spec</button></th>
          <th><button type="button" class="sort-btn" data-sort="msNm">MS NM</button></th>
          <th><button type="button" class="sort-btn" data-sort="osNm">OS NM</button></th>
          <th><button type="button" class="sort-btn" data-sort="msHc">MS HC</button></th>
          <th><button type="button" class="sort-btn" data-sort="osHc">OS HC</button></th>
          <th><button type="button" class="sort-btn" data-sort="bis">BiS</button></th>
          <th><button type="button" class="sort-btn" data-sort="item_count">Total</button></th>
          <th>Slots received</th>
          <th><button type="button" class="sort-btn" data-sort="last_award_at">Last award</button></th>
        </tr>
      </thead>
      <tbody id="summary-body">
        <tr><td colspan="11">Loading…</td></tr>
      </tbody>
    </table>
  </main>

  <script src="/summary.js"></script>
</body>
</html>
